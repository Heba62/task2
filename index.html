<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>CORS</title>
</head>

<body>
    <h1>CORS</h1>
    <button onclick="getData()">Retrieving expenses</button>
    <h1></h1>
    <script>
        async function getData() {
            try {
                const response = "http://localhost:3000/api/expenses";
                const res = await fetch(response);
                const data = await res.json();
                console.log("Data: ", data);
            } catch (error) {
                console.error("Error: ", error);
            }
        }
    </script>
</body>

</html>
